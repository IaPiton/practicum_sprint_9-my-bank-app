openapi: 3.0.3
info:
  title: Сервис аккаунтов
  version: 1.0.0-SNAPSHOT

paths:
  /user/register:
    post:
      operationId: RegisterNewUser
      summary: Регистрация нового пользователя в системе
      description: Данные из UI формы передаются в систему и сохраняются в БД
      tags:
        - user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserDto'
      responses:
        "201":
          description: "Пользователь успешно зарегистрирован"
        "400":
          description: "Некорректный запрос или пользователь уже существует"
        "409":
          description: "Пользователь с таким username или email уже существует"
  /user/{keycloakId}:
    get:
      operationId: getUserByKeycloakId
      summary: Получение пользователя по ID
      description: Получение пользователя по ID из БД
      parameters:
        - name: keycloakId
          in: path
          required: true
          schema:
            type: string
          description: Keycloak ID пользователя
      tags:
        - user
      security: [USER]
      responses:
        "200":
          description: "Пользователь успешно зарегистрирован"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        "400":
          description: "Неудалось получить пользователя"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ResponseInfo:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          description: Код ответа
          example: 200
        message:
          type: string
          description: Сообщение
          example: "Operation completed successfully"

    UserDto:
      type: object
      properties:
        keycloakId:
          type: string
          description: Идентификатор пользователя в Keycloak
        login:
          type: string
          description: Логин пользователя
        password:
          type: string
          description: Пароль пользователя
        firstName:
          type: string
          description: Имя
        lastName:
          type: string
          description: Фамилия
        birthday:
          type: string
          format: date
          description: Дата рождения (yyyy-MM-dd)
        email:
          type: string
          format: email
          description: Email адрес
        balance:
          type: number
          format: decimal
          description: Баланс счета