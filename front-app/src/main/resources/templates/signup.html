<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Регистрация в банке</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            width: 100%;
        }

        .card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .card-header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .card-header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .card-body {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .form-row .form-group {
            flex: 1;
            margin-bottom: 0;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        label .required {
            color: #e74c3c;
            margin-left: 4px;
        }

        input, select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s ease;
            outline: none;
            font-family: inherit;
        }

        input:focus, select:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        input:hover, select:hover {
            border-color: #764ba2;
        }

        .error-message {
            background-color: #fee;
            border-left: 4px solid #e74c3c;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 8px;
        }

        .error-message ul {
            margin-left: 20px;
            color: #e74c3c;
            font-size: 13px;
        }

        .error-message li {
            margin: 5px 0;
        }

        .required-note {
            background-color: #f8f9fa;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 12px;
            color: #666;
            text-align: center;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
            font-size: 14px;
            color: #666;
        }

        .login-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .password-hint {
            font-size: 11px;
            color: #999;
            margin-top: 5px;
        }

        @media (max-width: 480px) {
            .card-body {
                padding: 20px;
            }

            .card-header h1 {
                font-size: 24px;
            }

            .form-row {
                flex-direction: column;
                gap: 20px;
            }
        }
    </style>
</head>

<body>
<div class="container">
    <div class="card">
        <div class="card-header">
            <h1>🏦 Регистрация в банке</h1>
            <p>Создайте аккаунт и управляйте финансами</p>
        </div>

        <div class="card-body">
            <div class="required-note">
                <span style="color:#e74c3c;">*</span> Все поля обязательны для заполнения
            </div>

            <div th:if="${errors != null and !errors.isEmpty()}" class="error-message">
                <ul>
                    <li th:each="error : ${errors}" th:text="${error}"></li>
                </ul>
            </div>

            <form th:action="@{/signup}" th:object="${userInfo}" method="post">
                <div class="form-group">
                    <label>
                        Логин
                        <span class="required">*</span>
                    </label>
                    <input type="text"
                           name="login"
                           th:field="*{login}"
                           placeholder="Введите логин"
                           required>
                </div>

                <div class="form-group">
                    <label>
                        Пароль
                        <span class="required">*</span>
                    </label>
                    <input type="password"
                           name="password"
                           th:field="*{passwordInfo.password}"
                           placeholder="Введите пароль"
                           required>
                    <div class="password-hint">Пароль должен содержать минимум 6 символов</div>
                </div>

                <div class="form-group">
                    <label>
                        Повторите пароль
                        <span class="required">*</span>
                    </label>
                    <input type="password"
                           name="confirm_password"
                           th:field="*{passwordInfo.confirmPassword}"
                           placeholder="Повторите пароль"
                           required>
                </div>

                <!-- Имя и фамилия в одной строке -->
                <div class="form-row">
                    <div class="form-group">
                        <label>
                            Фамилия
                            <span class="required">*</span>
                        </label>
                        <input type="text"
                               name="lastName"
                               th:field="*{personalInfo.lastName}"
                               placeholder="Иванов"
                               required>
                    </div>

                    <div class="form-group">
                        <label>
                            Имя
                            <span class="required">*</span>
                        </label>
                        <input type="text"
                               name="firstName"
                               th:field="*{personalInfo.firstName}"
                               placeholder="Иван"
                               required>
                    </div>
                </div>

                <div class="form-group">
                    <label>
                        Дата рождения
                        <span class="required">*</span>
                    </label>
                    <input type="date"
                           name="birthdate"
                           th:field="*{personalInfo.birthDate}"
                           required>
                </div>

                <div class="form-group">
                    <label>
                        Электронная почта
                        <span class="required">*</span>
                    </label>
                    <input type="email"
                           name="email"
                           th:field="*{personalInfo.email}"
                           placeholder="example@mail.com"
                           required>
                </div>

                <button type="submit" class="btn-submit">
                    ✨ Зарегистрироваться
                </button>
            </form>

            <div class="login-link">
                Уже есть аккаунт? <a href="/oauth2/authorization/front-ui">Войти</a>
            </div>
        </div>
    </div>
</div>
</body>

</html>
