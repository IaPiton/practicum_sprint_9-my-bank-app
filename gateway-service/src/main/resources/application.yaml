server:
  port: 8081

spring:
  application:
    name: gateway-service
  config:
    import: "optional:consul:"

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://${keycloak-custom.host}:${keycloak-custom.port}/realms/master

  cloud:
    gateway:
      routes:
        - id: account-service
          uri: http://localhost:8082
          predicates:
            - Path=/account/**
          filters:
            - RewritePath=/account/(?<segment>.*), /$\{segment}
            - name: JwtTokenRelay
              args:
                permittedPaths:
                  - /user/register
        - id: cash-service
          uri: http://localhost:8083
          predicates:
            - Path=/cash/**
          filters:
            - RewritePath=/cash/(?<segment>.*), /$\{segment}
            - name: JwtTokenRelay
        - id: cash-service
          uri: http://localhost:8085
          predicates:
            - Path=/transfer/**
          filters:
            - RewritePath=/transfer/(?<segment>.*), /$\{segment}
            - name: JwtTokenRelay

keycloak-custom:
  host: localhost
  port: 9090

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    ru.practicum.bank.gateway: DEBUG
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.springframework.web.reactive.function.client: DEBUG
    org.springframework.http: DEBUG