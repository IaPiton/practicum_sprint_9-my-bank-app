server:
  port: 8081

spring:
  application:
    name: gateway-service


  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://${keycloak-custom.host}:${keycloak-custom.port}/realms/master

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: account-service
              uri: http://localhost:8082
              predicates:
                - Path=/account/**
              filters:
                - RewritePath=/account/(?<segment>.*), /$\{segment}
                - name: JwtTokenRelay
                  args:
                    permittedPaths:
                      - /user/register

keycloak-custom:
  host: localhost
  port: 9090

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    root: INFO
    ru.practicum.bank.gateway: DEBUG
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.springframework.web.reactive.function.client: DEBUG
    org.springframework.http: DEBUG