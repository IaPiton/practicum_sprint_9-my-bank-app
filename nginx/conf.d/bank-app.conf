server {
    listen 80;
    server_name localhost;

    # Keycloak requests
    location ~ ^/(realms|resources|js|admin)/ {
        proxy_pass http://keycloak:8080$request_uri;

        # Критически важно: Host должен быть localhost:8080
        proxy_set_header Host localhost:8080;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host localhost;
        proxy_set_header X-Forwarded-Port 8080;

        # Говорим Keycloak, что он за прокси
        proxy_set_header X-Forwarded-Server localhost;

        # Переписываем Location заголовки
        proxy_redirect http://keycloak:8080/ http://localhost:8080/;
        proxy_redirect https://keycloak:8080/ https://localhost:8080/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Frontend requests
    location / {
        proxy_pass http://front-service:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}